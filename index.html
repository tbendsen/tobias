<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
</head>
<body>
  <h1>Hello, World!</h1>

  <button id="knap">Tryk på mig</button>
  <p id="besked">Du har ikke trykket endnu.</p>

  <p><a href="gaestebog.php">Se gæstebogen (PHP + JavaScript)</a></p>

  <script>
    // JavaScript kører i browseren og kan reagere på det, brugeren gør.
    let antal = 0;

    const knap = document.getElementById("knap");
    const besked = document.getElementById("besked");

    // Når der trykkes på knappen, tæller vi op og ændrer teksten på siden.
    knap.addEventListener("click", function () {
      antal = antal + 1;
      besked.textContent = "Du har trykket " + antal + " gang(e).";
    });
  </script>
</body>
</html>
